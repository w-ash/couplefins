[project]
name = "couplefins"
version = "0.11.0"
description = "Shared finance reconciliation tool for couples"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "alembic>=1.15",
    "python-multipart>=0.0.20",
    "attrs>=25.4.0,<26.0.0",
    "argon2-cffi>=24.0",
    "PyJWT>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "basedpyright>=1.29",
    "pre-commit>=4.1",
    "vulture>=2.15",
]

[tool.uv]
package = false

# ── Ruff ───────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py314"
preview = true
output-format = "full"
exclude = ["docs/dev-setup-guide"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "UP",    # pyupgrade — modernize syntax
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "C4",    # flake8-comprehensions
    "S",     # flake8-bandit (security)
    "PT",    # flake8-pytest-style
    "COM",   # flake8-commas (trailing commas)
    "DTZ",   # flake8-datetimez (timezone awareness)
    "PERF",  # Performance anti-patterns
    "ASYNC", # Async/await issues
    "ARG",   # Function argument validation
    "FURB",  # Modernize Python patterns
    "LOG",   # Logging best practices
    "TRY",   # Exception handling
    "PL",    # Pylint checks
    "PTH",   # Use pathlib
]
ignore = [
    "E501",    # Line too long — handled by formatter
    "COM812",  # Trailing comma — conflicts with formatter
    "TC001",   # Move to TYPE_CHECKING — obsolete with PEP 649
    "TC002",   # Move to TYPE_CHECKING — obsolete with PEP 649
    "TC003",   # Move to TYPE_CHECKING — obsolete with PEP 649
    "TC006",   # Cast quotes — contradicts PEP 649
    "TRY003",  # Long exception messages — clear errors are good
    "TRY400",  # Use logging.exception — doesn't apply to loguru
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/interface/api/**/*.py" = [
    "RUF029",  # FastAPI async handlers without await
]
"src/application/use_cases/**/*.py" = [
    "PLR6301",  # Stateless execute() is intentional — use case architecture pattern
]
"vulture_whitelist.py" = [
    "B018",    # Useless expressions — intentional, Vulture whitelist convention
    "E402",    # Import order — imports grouped by category for readability
    "F401",    # Unused imports — the import IS the usage for Vulture
]
"tests/**/*.py" = [
    "S101",     # Allow assert
    "S105",     # Hardcoded password strings in tests
    "S106",     # Hardcoded password arguments in tests
    "S107",     # Hardcoded password defaults in tests
    "ARG001",   # Unused function args (fixtures)
    "ARG002",   # Unused method args (fixtures)
    "PLR2004",  # Magic numbers in tests
    "PLR0913",  # Many args in factory functions
    "PLR6301",  # Test methods in classes don't use self
    "PLC0415",  # Deferred imports in fixtures
    "PLC2701",  # Private imports (_shared helpers)
    "PT011",    # Broad pytest.raises
    "ERA001",   # Commented-out code (documentation)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
split-on-trailing-comma = true
force-sort-within-sections = true
order-by-type = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ── BasedPyright ───────────────────────────────
[tool.basedpyright]
include = ["src"]
exclude = ["tests", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"

reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDeprecated = "warning"

reportAny = "warning"
reportExplicitAny = "warning"
reportUnusedCallResult = "none"
reportMissingTypeArgument = "warning"
reportUninitializedInstanceVariable = "none"
enableTypeIgnoreComments = true

# ── pytest ─────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --tb=short -m 'not slow and not performance and not diagnostic'"
markers = [
    "unit: unit tests — pure logic, no external deps (<100ms)",
    "integration: integration tests — real DB, mocked APIs (<1s)",
    "slow: tests >1 second (skipped by default)",
    "performance: timing assertion tests (skipped by default)",
    "diagnostic: investigation-only tests (skipped by default)",
]

# ── Vulture (dead code) ───────────────────────────
[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = [
    "@router.*",               # FastAPI route handlers
    "@field_validator",        # Pydantic field validators
    "@app.*",                  # FastAPI exception handlers
    "@override",               # typing.override
]
ignore_names = [
    "__tablename__",           # SQLAlchemy declarative base
    "__table_args__",          # SQLAlchemy constraints/indexes
    "__attrs_post_init__",     # attrs post-init validation
    "__all__",                 # module public API exports
    "model_config",            # Pydantic model configuration
    "_model_class",            # Repository pattern: class-level model ref
    "_to_domain",              # Repository: abstract model→entity conversion
    "_to_model",               # Repository: abstract entity→model conversion
]
