[project]
name = "couplefins"
version = "1.15.1"
description = "Household finance tool for couples"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "structlog>=26.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "python-multipart>=0.0.32",
    "attrs>=26.1.0,<27.0.0",
    "argon2-cffi>=24.0",
    "PyJWT>=2.15",
    "anthropic>=1.13,<2",
    "mcp>=2.3,<3",
    "mcp-types>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "basedpyright>=1.40",
    "pre-commit>=4.6",
    "vulture>=2.15",
]

[tool.uv]
package = false
# Single source of truth for the uv version. The Dockerfile's uv image tag must
# stay in step: uv refuses a uv.lock whose schema is newer than it understands,
# and that failure surfaces at deploy time, long after CI has gone green.
required-version = ">=0.13,<0.14"

# ── Ruff ───────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py314"
preview = true
output-format = "full"
exclude = ["docs/dev-setup-guide"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "UP",    # pyupgrade — modernize syntax
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "C4",    # flake8-comprehensions
    "S",     # flake8-bandit (security)
    "PT",    # flake8-pytest-style
    "COM",   # flake8-commas (trailing commas)
    "DTZ",   # flake8-datetimez (timezone awareness)
    "PERF",  # Performance anti-patterns
    "ASYNC", # Async/await issues
    "ARG",   # Function argument validation
    "FURB",  # Modernize Python patterns
    "LOG",   # Logging best practices
    "TRY",   # Exception handling
    "PL",    # Pylint checks
    "PTH",   # Use pathlib
]
ignore = [
    "line-too-long",                        # handled by formatter
    "missing-trailing-comma",               # conflicts with formatter
    "typing-only-first-party-import",       # TYPE_CHECKING imports are obsolete with PEP 649
    "typing-only-third-party-import",       # TYPE_CHECKING imports are obsolete with PEP 649
    "typing-only-standard-library-import",  # TYPE_CHECKING imports are obsolete with PEP 649
    "runtime-cast-value",                   # quoted cast types contradict PEP 649
    "raise-vanilla-args",                   # long exception messages — clear errors are good
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"src/application/chat/use_case.py" = [
    "yield-in-context-manager-in-async-generator",  # Both consumers close the stream with contextlib.aclosing
]
"src/interface/api/**/*.py" = [
    "unused-async",  # FastAPI async handlers without await
]
"src/application/use_cases/**/*.py" = [
    "no-self-use",  # Stateless execute() is intentional — use case architecture pattern
]
"src/interface/mcp/confirmation.py" = [
    "hardcoded-password-string",     # CONFIRM_TOKEN_FIELD holds a JSON field NAME ("confirm_token"),
                # not a credential — bandit's token-name heuristic false-positives
]
"src/interface/mcp/server.py" = [
    "unused-async",   # MCP SDK's request-handler protocol requires async handlers
                # even when a handler (tools/list) does no I/O
    "unused-method-argument",   # _UnavailableLLM.stream must match LLMClientProtocol's
    "no-self-use",  # signature exactly — protocol conformance, not real logic
]
"src/interface/mcp/__main__.py" = [
    "import-outside-top-level",  # Deliberately deferred imports: stderr logging must be
                # configured before the server (and its logger tree) loads —
                # stdout is the JSON-RPC channel
]
"src/application/chat/user_data.py" = [
    "subclass-builtin",  # UserData must BE a str: json.dumps serializes str subclasses
                # as plain strings and str-typed interfaces accept the marker
                # transparently — collections.UserString would break both
]
"vulture_whitelist.py" = [
    "useless-expression",    # Useless expressions — intentional, Vulture whitelist convention
    "module-import-not-at-top-of-file",    # Import order — imports grouped by category for readability
    "unused-import",    # Unused imports — the import IS the usage for Vulture
]
"tests/**/*.py" = [
    "assert",     # Allow assert
    "hardcoded-password-string",     # Hardcoded password strings in tests
    "hardcoded-password-func-arg",     # Hardcoded password arguments in tests
    "hardcoded-password-default",     # Hardcoded password defaults in tests
    "unused-function-argument",   # Unused function args (fixtures)
    "unused-method-argument",   # Unused method args (fixtures)
    "magic-value-comparison",  # Magic numbers in tests
    "too-many-arguments",  # Many args in factory functions
    "no-self-use",  # Test methods in classes don't use self
    "import-outside-top-level",  # Deferred imports in fixtures
    "import-private-name",  # Private imports (_shared helpers)
    "pytest-raises-too-broad",    # Broad pytest.raises
    "commented-out-code",   # Commented-out code (documentation)
    "unused-async",   # Async test stubs replace awaited callables — they must be
                # async even when the fake body does no async work
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
split-on-trailing-comma = true
force-sort-within-sections = true
order-by-type = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ── BasedPyright ───────────────────────────────
[tool.basedpyright]
include = ["src"]
exclude = ["tests", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"

reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDeprecated = "warning"

reportAny = "warning"
reportExplicitAny = "warning"
reportUnusedCallResult = "none"
reportMissingTypeArgument = "warning"
reportUninitializedInstanceVariable = "none"
enableTypeIgnoreComments = true

# ── pytest ─────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --tb=short -m 'not slow and not performance and not diagnostic'"
markers = [
    "unit: unit tests — pure logic, no external deps (<100ms)",
    "integration: integration tests — real DB, mocked APIs (<1s)",
    "slow: tests >1 second (skipped by default)",
    "performance: timing assertion tests (skipped by default)",
    "diagnostic: investigation-only tests (skipped by default)",
]

# ── Vulture (dead code) ───────────────────────────
[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = [
    "@router.*",               # FastAPI route handlers
    "@field_validator",        # Pydantic field validators
    "@model_validator",        # Pydantic model validators
    "@app.*",                  # FastAPI exception handlers
    "@override",               # typing.override
]
ignore_names = [
    "__tablename__",           # SQLAlchemy declarative base
    "__table_args__",          # SQLAlchemy constraints/indexes
    "__attrs_post_init__",     # attrs post-init validation
    "__all__",                 # module public API exports
    "model_config",            # Pydantic model configuration
    "_model_class",            # Repository pattern: class-level model ref
    "_to_domain",              # Repository: abstract model→entity conversion
    "_to_model",               # Repository: abstract entity→model conversion
]
