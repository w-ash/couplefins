# Orval output is regenerated wholesale; whitespace fixes would churn on every `pnpm generate`.
exclude: ^web/src/api/generated/
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-toml
    -   id: check-json
    -   id: debug-statements
    -   id: check-added-large-files
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format
