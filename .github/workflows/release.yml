name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > CHANGES.md
          if ! [ -s CHANGES.md ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION — add one before tagging"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        run: gh release create "$TAG" --title "$TAG" --notes-file CHANGES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      # --ha=false is load-bearing: Fly otherwise provisions a second machine
      # for high availability, which would split the in-process SSE event bus
      # and the chat rate limiter. This app must stay at one machine.
      #
      # No pre-deploy drain gate: every request here is request-scoped and
      # short (CSV uploads are parsed in memory, never queued), so there is no
      # background work a deploy could interrupt.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
