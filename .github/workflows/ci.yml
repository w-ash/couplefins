name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A Postgres container, not a Neon branch. The integration suite drops and
    # re-migrates the schema once and then TRUNCATEs every table after each
    # test; over a network link to Neon that is latency-bound to the point of
    # uselessness (measured: 39s locally, still no result after 20 minutes
    # against a Neon branch in us-west-2). A service container also keeps real
    # financial data out of CI entirely. Neon is used only for schema-diff, in
    # its own job below.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: couplefins_test
          POSTGRES_USER: couplefins
          POSTGRES_PASSWORD: couplefins
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U couplefins"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both, and identical: settings reads DATABASE__URL, while the
      # integration suite reads TEST_DATABASE__URL and then points
      # DATABASE__URL at its own value. The suite also refuses any URL
      # containing "-pooler", since it truncates every table on teardown.
      DATABASE__URL: postgresql+asyncpg://couplefins:couplefins@localhost:5432/couplefins_test
      TEST_DATABASE__URL: postgresql+asyncpg://couplefins:couplefins@localhost:5432/couplefins_test

    steps:
      # docs/dev-setup-guide is a docs-only submodule; cloning it would add
      # auth plumbing for something no job reads.
      - uses: actions/checkout@v7
        with:
          submodules: false

      # Full version, not `@v9` — setup-uv stopped publishing major/minor tags
      # at v8.0.0, deliberately, as a supply-chain measure after the tj-actions
      # compromise. A shortened tag fails at "Unable to resolve action".
      - uses: astral-sh/setup-uv@v9.0.0

      # --locked, not --frozen: assert uv.lock is current for pyproject.toml.
      # --frozen installs a stale lock happily, deferring the failure to the
      # Dockerfile's own `uv sync --locked` at deploy — after the release tag
      # is already published.
      - name: Install dependencies
        run: uv sync --locked

      # Exercises the alembic CLI path, which reads DATABASE__URL only because
      # alembic.ini deliberately leaves sqlalchemy.url unset.
      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run basedpyright src/

      - name: Dead code
        run: uv run vulture

      # Plain `pytest`: addopts already deselects slow/performance/diagnostic.
      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from web/package.json's `packageManager` field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm check` is biome + tsc --noEmit + vite build, so this covers the
      # production build too — no separate build step.
      - name: Lint, type check and build
        run: pnpm check

      - name: Test
        run: pnpm test

  # Without this, the Dockerfile's first real exercise is `flyctl deploy` in
  # release.yml — which runs *after* the GitHub Release is published, so a
  # broken build would leave a public tag pointing at undeployable code.
  # ubuntu-latest is amd64 natively, matching Fly, so no `platforms:` is needed.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built, never pushed — Fly builds the real image at deploy.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Isolated from the test job on purpose: this is the only thing that needs
  # Neon, it only runs when a PR touches migrations, and a Neon outage or a
  # missing API key must never be able to redden the main gate.
  schema-diff:
    name: Schema diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Check for migration changes
        id: migration-check
        run: echo "changed=$(git diff --name-only origin/main -- alembic/ | head -1)" >> "$GITHUB_OUTPUT"

      # Branches from the project default. Neon branches are copy-on-write and
      # isolated; this one only ever has migrations applied to it, never the
      # test suite, and is removed by neon-cleanup.yml at PR close or by the
      # expiry below. Secrets are unavailable to fork PRs, so an outside pull
      # request fails here rather than reaching any data.
      - name: Create Neon branch
        id: neon-branch
        if: steps.migration-check.outputs.changed != ''
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: neondb
          expires_at: ${{ github.event.pull_request.updated_at }}

      - uses: astral-sh/setup-uv@v9.0.0
        if: steps.migration-check.outputs.changed != ''

      - name: Apply the PR's migrations to the branch
        if: steps.migration-check.outputs.changed != ''
        run: |
          uv sync --locked
          URL="${DB_URL/postgresql:\/\//postgresql+asyncpg://}"
          URL="${URL/postgres:\/\//postgresql+asyncpg://}"
          DATABASE__URL="$URL" uv run alembic upgrade head
        env:
          DB_URL: ${{ steps.neon-branch.outputs.db_url }}

      # base_branch is Neon's default branch, named `production` here — not a
      # git branch. The diff shows what the new migration does to the real
      # schema.
      - name: Diff against production
        if: steps.migration-check.outputs.changed != ''
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: ci/pr-${{ github.event.number }}
          base_branch: production
          api_key: ${{ secrets.NEON_API_KEY }}
          database: neondb
